        /* ==========================================================================
           1. CSS STYLES (ASSETS/STYLE.CSS)

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        :root {
            --hijau-tua: #14532d;
            --hijau-terang: #16a34a;
            --pink-utama: #db2777;
            --bg-light: #f8fafc;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.6;
            padding-bottom: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0 16px;
        }

        /* Header */
        .main-header {
            background-color: var(--hijau-tua);
            color: #ffffff;
            text-align: center;
            padding: 24px 16px;
            margin-bottom: 24px;
            box-shadow: var(--shadow);
        }

        .main-header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .sub-header {
            font-size: 0.95rem;
            margin-top: 8px;
            opacity: 0.9;
        }

        /* Kolom Pencarian */
        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e2e8f0;
            border-radius: var(--radius);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s;
        }

        .search-box input:focus {
            border-color: var(--hijau-terang);
            box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.15);
        }

        /* Pilihan Hari */
        .days-filter {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-bottom: 24px;
        }

        .btn-day {
            padding: 12px;
            border: 1px solid #e2e8f0;
            background: #ffffff;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-dark);
            transition: all 0.2s ease;
        }

        .btn-day.active {
            background-color: var(--hijau-tua);
            color: #ffffff;
            border-color: var(--hijau-tua);
        }

        /* Hasil Pencarian */
        .search-results {
            background: #ffffff;
            padding: 16px;
            border-radius: var(--radius);
            margin-bottom: 24px;
            border-left: 4px solid var(--hijau-terang);
            box-shadow: var(--shadow);
        }

        .search-results h3 {
            margin-bottom: 12px;
            color: var(--hijau-tua);
        }

        .search-item {
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }

        .search-item:last-child {
            border-bottom: none;
        }

        .search-item .nama-ustaz {
            font-weight: 700;
            color: #0f172a;
        }

        .search-item .detail-mengajar {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        /* Kartu Informasi */
        .capture-padding {
            padding: 4px;
        }

        .info-cards {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 24px;
        }

        .card {
            background: #ffffff;
            padding: 16px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .card h3 {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .card p {
            font-size: 1.05rem;
            font-weight: 600;
        }

        /* Tata Letak Jadwal */
        .schedule-grid {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .schedule-block {
            background: #ffffff;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .block-header {
            padding: 12px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .banin-zone .block-header { background-color: var(--hijau-tua); }
        .banat-zone .block-header { background-color: var(--pink-utama); }

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            padding: 12px 16px;
            font-size: 0.9rem;
            font-weight: 600;
            color: #ffffff;
        }

        .banin-zone th { background-color: var(--hijau-tua); opacity: 0.95; }
        .banat-zone th { background-color: var(--pink-utama); opacity: 0.95; }

        td {
            padding: 14px 16px;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .fan-name {
            font-weight: 600;
            color: var(--text-dark);
            display: block;
        }

        .teacher-name {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: block;
            margin-top: 2px;
        }

        /* Tombol Aksi */
        .action-buttons {
            margin-top: 28px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: var(--radius);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            text-align: center;
        }

        .btn-primary { background-color: var(--hijau-terang); color: white; }
        .btn-secondary { background-color: #64748b; color: white; }
        .btn-success { background-color: #25d366; color: white; }

        .btn:active { opacity: 0.9; }
        .hidden { display: none !important; }

        /* POSTER MODE STYLES */
        body.poster-mode {
            background-color: #ffffff;
            padding: 0;
        }
        body.poster-mode .no-poster {
            display: none !important;
        }
        body.poster-mode .action-buttons {
            padding: 0 16px;
        }

        /* RESPONSIVE MEDIA QUERIES (DESKTOP) */
        @media (min-width: 768px) {
            .main-header h1 { font-size: 2rem; }
            .days-filter { grid-template-columns: repeat(6, 1fr); }
            .info-cards { flex-direction: row; }
            .card { flex: 1; }
            .schedule-grid { flex-direction: row; }
            .schedule-block { flex: 1; }
            .action-buttons { flex-direction: row; }
        }
    </style>
</head>

            <button id="btn-export" class="btn btn-primary">Export JPG</button>
            <button id="btn-whatsapp" class="btn btn-success">Bagikan ke WhatsApp</button>
        </section>

    </main>

                    { "kelas": "Isti'dad A", "jam1_fan": "Fiqih", "jam1_pengajar": "Agil Sahaly", "jam2_fan": "Fiqih", "jam2_pengajar": "Agil Sahaly" },
                    { "kelas": "Kelas Satu", "jam1_fan": "Tauhid", "jam1_pengajar": "Khoiron", "jam2_fan": "Tajwid", "jam2_pengajar": "Abdullah Sholeh" },
                    { "kelas": "Kelas Dua", "jam1_fan": "Tajwid", "jam1_pengajar": "Abdullah Sholeh", "jam2_fan": "Tauhid", "jam2_pengajar": "Khoiron" },
                    { "kelas": "Kelas Tiga", "jam1_fan": "Akhlak", "jam1_pengajar": "Abdur Rozaq", "jam2_fan": "Muhafadzoh", "jam2_pengajar": "Lora Izzul Fahmi" },
                    { "kelas": "Kelas Empat", "jam1_fan": "Fiqih", "jam1_pengajar": "Taufiqurrahman", "jam2_fan": "Sorogan", "jam2_pengajar": "Taufiqurrahman" }
                ],
                "banat": [
                    { "kelas": "Sugro", "jam1_fan": "Fiqih", "jam1_pengajar": "Nabila", "jam2_fan": "Fiqih", "jam2_pengajar": "Nabila" },
                    { "kelas": "Kelas Satu", "jam1_fan": "Fiqih", "jam1_pengajar": "Meisi", "jam2_fan": "Tajwid", "jam2_pengajar": "Liyadzah" },
                    { "kelas": "Kelas Dua", "jam1_fan": "Fiqih", "jam1_pengajar": "Mila", "jam2_fan": "I'lal", "jam2_pengajar": "Guru Tugas" },
                    { "kelas": "Kelas Tiga", "jam1_fan": "Fiqih", "jam1_pengajar": "Neng Zamiroh", "jam2_fan": "Fiqih", "jam2_pengajar": "Neng Zamiroh" },
                    { "kelas": "Kelas Empat", "jam1_fan": "Nahwu", "jam1_pengajar": "Guru Tugas", "jam2_fan": "Akhlak", "jam2_pengajar": "Neng Sinta" },
                    { "kelas": "Kelas Lima", "jam1_fan": "Mustholah Hadits", "jam1_pengajar": "Lora Izzul Fahmi", "jam2_fan": "Tauhid", "jam2_pengajar": "As'adus Shodiqin" },
                    { "kelas": "Kelas Enam", "jam1_fan": "Tauhid", "jam1_pengajar": "As'adus Shodiqin", "jam2_fan": "Fiqih", "jam2_pengajar": "Abdur Rozaq" }
                ]
            }
        };

        let hariTerpilih = "Sabtu";

        // DOM Elements
        const currentDayText = document.getElementById('current-day-text');
        const tableBaninBody = document.querySelector('#table-banin tbody');
        const tableBanatBody = document.querySelector('#table-banat tbody');
        const btnDays = document.querySelectorAll('.btn-day');
        const searchInput = document.getElementById('search-input');
        const searchResultsSection = document.getElementById('search-results-section');
        const searchResultsContainer = document.getElementById('search-results-container');

        // Render Tabel Utama
        function renderJadwal(hari) {
            hariTerpilih = hari;
            currentDayText.textContent = `${hari}, 06 Juni 2026`;

            tableBaninBody.innerHTML = '';
            tableBanatBody.innerHTML = '';

            const dataHari = databaseJadwal[hari] || { banin: [], banat: [] };

            // Render Banin
            if (dataHari.banin.length === 0) {
                tableBaninBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Tidak ada jadwal</td></tr>`;
            } else {
                dataHari.banin.forEach(item => tableBaninBody.appendChild(createRow(item)));
            }

            // Render Banat
            if (dataHari.banat.length === 0) {
                tableBanatBody.innerHTML = `<tr><td colspan="3" style="text-align:center; color:var(--text-muted);">Tidak ada jadwal</td></tr>`;
            } else {
                dataHari.banat.forEach(item => tableBanatBody.appendChild(createRow(item)));
            }
        }

        function createRow(data) {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td style="font-weight:600;">${data.kelas}</td>
                <td>
                    <span class="fan-name">${data.jam1_fan}</span>
                    <span class="teacher-name">${data.jam1_pengajar}</span>
                </td>
                <td>
                    <span class="fan-name">${data.jam2_fan}</span>
                    <span class="teacher-name">${data.jam2_pengajar}</span>
                </td>
            `;
            return tr;
        }

        // Event Pengubah Hari
        btnDays.forEach(button => {
            button.addEventListener('click', function() {
                btnDays.forEach(btn => btn.classList.remove('active'));
                this.classList.add('active');
                renderJadwal(this.getAttribute('data-hari'));
            });
        });

        // Fitur Pencarian Parsial & Case Insensitive
        searchInput.addEventListener('input', function() {
            const query = this.value.toLowerCase().trim();
            
            if (query === '') {
                searchResultsSection.classList.add('hidden');
                return;
            }

            searchResultsContainer.innerHTML = '';
            let hasilDitemukan = false;

            for (const [hari, kelompok] of Object.entries(databaseJadwal)) {
                kelompok.banin.forEach(item => {
                    if (item.jam1_pengajar.toLowerCase().includes(query)) {
                        addResultItem(item.jam1_pengajar, hari, `${item.kelas} Banin`, item.jam1_fan, "Jam ke-1");
                        hasilDitemukan = true;
                    }
                    if (item.jam2_pengajar.toLowerCase().includes(query)) {
                        addResultItem(item.jam2_pengajar, hari, `${item.kelas} Banin`, item.jam2_fan, "Jam ke-2");
                        hasilDitemukan = true;
                    }
                });

                kelompok.banat.forEach(item => {
                    if (item.jam1_pengajar.toLowerCase().includes(query)) {
                        addResultItem(item.jam1_pengajar, hari, `${item.kelas} Banat`, item.jam1_fan, "Jam ke-1");
                        hasilDitemukan = true;
                    }
                    if (item.jam2_pengajar.toLowerCase().includes(query)) {
                        addResultItem(item.jam2_pengajar, hari, `${item.kelas} Banat`, item.jam2_fan, "Jam ke-2");
                        hasilDitemukan = true;
                    }
                });
            }

            if (hasilDitemukan) {
                searchResultsSection.classList.remove('hidden');
            } else {
                searchResultsContainer.innerHTML = `<p style="color:var(--text-muted); font-size:0.9rem;">Pengajar tidak ditemukan.</p>`;
                searchResultsSection.classList.remove('hidden');
            }
        });

        function addResultItem(nama, hari, kelas, fan, jam) {
            const div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = `
                <div class="nama-ustaz">${nama}</div>
                <div class="detail-mengajar">${hari} | ${kelas} | ${fan} | ${jam}</div>
            `;
            searchResultsContainer.appendChild(div);
        }

        // Fitur Mode Poster
        const btnPoster = document.getElementById('btn-poster');
        btnPoster.addEventListener('click', function() {
            document.body.classList.toggle('poster-mode');
            if (document.body.classList.contains('poster-mode')) {
                this.textContent = "Keluar Mode Poster";
                this.style.backgroundColor = "#ef4444";
            } else {
                this.textContent = "Mode Poster";
                this.style.backgroundColor = "#64748b";
            }
        });

        // Fitur Ekspor Gambar JPG via html2canvas
        document.getElementById('btn-export').addEventListener('click', function() {
            const areaEkspor = document.getElementById('capture-area');
            const opsi = {
                scale: 2, 
                useCORS: true,
                backgroundColor: "#ffffff"
            };

            html2canvas(areaEkspor, opsi).then(canvas => {
                const link = document.createElement('a');
                link.download = `jadwal-${hariTerpilih.toLowerCase()}.jpg`;
                link.href = canvas.toDataURL('image/jpeg', 0.9);
                link.click();
            });
        });

        // Fitur Bagikan ke WhatsApp
        document.getElementById('btn-whatsapp').addEventListener('click', function() {
            const teksPesan = encodeURIComponent(
                `Jadwal Pelajaran dan Pengajar\nMuhadloroh Bustanul Ulum Daltim\n\nSilakan cek jadwal harian ter-update di aplikasi web.`
            );
            window.open(`https://api.whatsapp.com/send?text=${teksPesan}`, '_blank');
        });

        // Inisialisasi awal aplikasi
        window.addEventListener('DOMContentLoaded', () => {
            renderJadwal("Sabtu");
        });
    </script>
</body>
</html>
