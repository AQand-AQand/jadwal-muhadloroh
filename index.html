<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MUHADLOROH BUSTANUL ULUM DALTIM</title>
<style>
body{font-family:Arial,sans-serif;max-width:900px;margin:auto;padding:16px}
.card{border:1px solid #ccc;border-radius:10px;padding:12px;margin:10px 0}
input{width:100%;padding:10px}
button{padding:8px 12px;margin:4px}
</style>
</head>
<body>
<h1>MUHADLOROH BUSTANUL ULUM DALTIM</h1>
<p>Contoh versi awal website jadwal pengajar.</p>

<input id="q" placeholder="Cari pengajar, fan, atau kelas...">

<div id="hasil"></div>

<script>
const data = [
{hari:"Ahad",kelas:"Isti'dad A",jam:"1",fan:"Nahwu",pengajar:"Lora Izzul Fahmi"},
{hari:"Ahad",kelas:"Isti'dad A",jam:"2",fan:"Nahwu",pengajar:"Lora Izzul Fahmi"},
{hari:"Ahad",kelas:"Kelas Satu",jam:"1",fan:"Fiqih",pengajar:"Hubailul Hakam"},
{hari:"Ahad",kelas:"Kelas Satu",jam:"2",fan:"Fiqih",pengajar:"Hubailul Hakam"},
{hari:"Senin",kelas:"Isti'dad A",jam:"1",fan:"Fiqih",pengajar:"Agil Sahaly"},
{hari:"Senin",kelas:"Isti'dad A",jam:"2",fan:"Fiqih",pengajar:"Agil Sahaly"},
{hari:"Selasa",kelas:"Kelas Empat Banat",jam:"2",fan:"Ushul",pengajar:"Ahmad Muzakki"},
{hari:"Rabu",kelas:"Kelas Lima Banat",jam:"1",fan:"Nahwu",pengajar:"Ahmad Muzakki"},
{hari:"Kamis",kelas:"Kelas Lima Banat",jam:"1",fan:"M. Hadist",pengajar:"Lora Izzul Fahmi"}
];

function render(list){
  const el=document.getElementById('hasil');
  el.innerHTML=list.map(x=>`
  <div class="card">
  <b>${x.hari}</b><br>
  ${x.kelas}<br>
  Jam ke-${x.jam}<br>
  ${x.fan}<br>
  ${x.pengajar}
  </div>`).join('');
}

render(data);

document.getElementById('q').addEventListener('input',e=>{
 const q=e.target.value.toLowerCase();
 render(data.filter(x=>
   x.pengajar.toLowerCase().includes(q)||
   x.fan.toLowerCase().includes(q)||
   x.kelas.toLowerCase().includes(q)
 ));
});
</script>
</body>
</html>
