<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MUHADLOROH BUSTANUL ULUM DALTIM</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f5f5;margin:0}
header{background:#14532d;color:#fff;padding:18px;text-align:center}
.wrap{max-width:1000px;margin:auto;padding:15px}
input,select,button{padding:10px;border-radius:8px;border:1px solid #ccc}
input{width:100%;box-sizing:border-box}
.card{background:#fff;padding:12px;margin:10px 0;border-radius:10px}
.small{color:#555}
.btn{background:#14532d;color:#fff;border:none}
</style>
</head>
<body>
<header>
<h2>MUHADLOROH BUSTANUL ULUM DALTIM</h2>
<div>Sistem Jadwal Pengajar</div>
</header>
<div class="wrap">
<p><b>Jam 1:</b> 14.00–15.00 WIB | <b>Jam 2:</b> 15.30–16.30 WIB</p>

<input id="q" placeholder="Cari pengajar, fan, atau kelas...">

<button class="btn" onclick="shareToday()">Bagikan Jadwal Hari Ini</button>

<div id="hasil"></div>
</div>

<script>
const data=[
{hari:"Ahad",kelas:"Isti'dad A",jam:1,fan:"Nahwu",pengajar:"Lora Izzul Fahmi"},
{hari:"Ahad",kelas:"Isti'dad A",jam:2,fan:"Nahwu",pengajar:"Lora Izzul Fahmi"},
{hari:"Ahad",kelas:"Kelas Satu",jam:1,fan:"Fiqih",pengajar:"Hubailul Hakam"},
{hari:"Ahad",kelas:"Kelas Satu",jam:2,fan:"Fiqih",pengajar:"Hubailul Hakam"},
{hari:"Senin",kelas:"Isti'dad A",jam:1,fan:"Fiqih",pengajar:"Agil Sahaly"},
{hari:"Senin",kelas:"Isti'dad A",jam:2,fan:"Fiqih",pengajar:"Agil Sahaly"},
{hari:"Selasa",kelas:"Kelas Lima Banat",jam:1,fan:"Nahwu",pengajar:"Ahmad Muzakki"},
{hari:"Selasa",kelas:"Kelas Enam Banat",jam:2,fan:"Tasawuf",pengajar:"Lora Abdul Fattah"},
{hari:"Rabu",kelas:"Kelas Lima Banat",jam:1,fan:"Nahwu",pengajar:"Ahmad Muzakki"},
{hari:"Kamis",kelas:"Kelas Lima Banat",jam:1,fan:"M. Hadist",pengajar:"Lora Izzul Fahmi"}
];

function render(list){
document.getElementById('hasil').innerHTML=list.map(x=>`
<div class="card">
<b>${x.hari}</b><br>
${x.kelas}<br>
Jam ke-${x.jam}<br>
${x.fan}<br>
<div class="small">${x.pengajar}</div>
</div>`).join('');
}

function shareToday(){
let txt="MUHADLOROH BUSTANUL ULUM DALTIM";
window.open("https://wa.me/?text="+encodeURIComponent(txt));
}

render(data);

q.oninput=()=>{
let v=q.value.toLowerCase();
render(data.filter(x=>
x.pengajar.toLowerCase().includes(v)||
x.fan.toLowerCase().includes(v)||
x.kelas.toLowerCase().includes(v)
));
}
</script>
</body>
</html>
