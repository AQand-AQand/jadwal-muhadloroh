    function render(query = "") {
        const container = document.getElementById('jadwal-container');
        container.innerHTML = "";
        ["Sabtu", "Ahad", "Senin", "Selasa", "Rabu", "Kamis"].forEach(hari => {
            let rows = db.filter(d => d.h === hari && (d.j1.toLowerCase().includes(query.toLowerCase()) || d.j2.toLowerCase().includes(query.toLowerCase())));
            if(rows.length > 0) {
                let html = `<h3>${hari}</h3><table><thead><tr><th>Kelas</th><th>Jam 1</th><th>Jam 2</th></tr></thead><tbody>`;
                rows.forEach(d => { html += `<tr><td>${d.k}<br>(${d.g})</td><td>${d.j1}</td><td>${d.j2}</td></tr>`; });
                container.innerHTML += html + `</tbody></table>`;
            }
        });
    }

    // Toggle Menu
    document.getElementById('mainMenuTrigger').addEventListener('click', () => { document.getElementById('menuOptions').classList.toggle('show'); });

    // PWA Logic
    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferredPrompt = e; document.getElementById('btn-install').style.display = 'flex'; });
    document.getElementById('btn-install').addEventListener('click', () => { deferredPrompt.prompt(); });

    document.getElementById('search-box').addEventListener('input', (e) => render(e.target.value));
    render();
